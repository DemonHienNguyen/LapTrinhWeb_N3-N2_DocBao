<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Tức 24h | Tin mới mỗi ngày</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="./">
  <header id="app-header"></header>

  <main class="news-page">
    <section class="news-hero">
      <div class="container news-hero-inner">
        <p class="eyebrow"><span class="eyebrow-dot"></span> GÓC NHÌN MỖI NGÀY</p>
        <h1>Chuyện hôm nay,<br><span>góc nhìn ngày mai.</span></h1>
        <p class="hero-description">Tin mới, câu chuyện đáng chú ý và những góc nhìn gần gũi về cuộc sống quanh ta.</p>
        <a class="hero-link" href="#latest">Khám phá tin mới <span aria-hidden="true">↓</span></a>
        <div class="hero-mark" aria-hidden="true">BẢN<br>TIN<span>.</span></div>
      </div>
    </section>

    <section class="container newsroom" id="latest">
      <div class="section-heading">
        <div>
          <p class="section-kicker">ĐỌC GÌ HÔM NAY?</p>
          <h2>Tin mới nhất</h2>
        </div>
        <form class="news-search" id="search-form" role="search">
          <label class="sr-only" for="search-input">Tìm kiếm tin tức</label>
          <input id="search-input" type="search" placeholder="Tìm kiếm bài viết...">
          <button type="submit" aria-label="Tìm kiếm">⌕</button>
        </form>
      </div>

      <div class="category-filters" role="group" aria-label="Lọc theo chủ đề">
        <button class="filter-chip is-active" type="button" data-category="all" aria-pressed="true">Tất cả</button>
        <button class="filter-chip" type="button" data-category="Thời sự" aria-pressed="false">Thời sự</button>
        <button class="filter-chip" type="button" data-category="Công nghệ" aria-pressed="false">Công nghệ</button>
        <button class="filter-chip" type="button" data-category="Kinh doanh" aria-pressed="false">Kinh doanh</button>
        <button class="filter-chip" type="button" data-category="Đời sống" aria-pressed="false">Đời sống</button>
        <button class="filter-chip" type="button" data-category="Thế giới" aria-pressed="false">Thế giới</button>
      </div>

      <p class="sample-note">Nội dung bài viết hiện là dữ liệu mẫu phục vụ hoàn thiện giao diện.</p>
      <div class="news-grid" id="news-grid" aria-live="polite"></div>
      <p class="empty-state" id="empty-state" hidden>Không tìm thấy bài viết phù hợp.</p>
    </section>

  </main>

  <footer id="app-footer"></footer>

  <!-- Thứ tự quan trọng: config -> api -> utils -> layout -> dữ liệu -> script riêng của trang -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/news-data.js"></script>
  <script src="js/pages/home.js"></script>
</body>
</html>
