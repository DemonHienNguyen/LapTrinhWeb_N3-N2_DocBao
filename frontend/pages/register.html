<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | Tin Tức 24h</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page" data-root="../">
  <main class="auth-screen">
    <a class="auth-brand" href="../index.html">TIN TỨC<span>24H</span></a>
    <section class="auth-card auth-card-register" aria-labelledby="register-title">
      <h1 class="auth-title" id="register-title">Tạo tài khoản</h1>
      <p class="auth-subtitle">Đăng ký thành viên để lưu lại hành trình đọc tin của bạn.</p>
      <form class="auth-form" id="register-form">
        <div class="auth-field">
          <input id="register-name" name="name" type="text" autocomplete="name" maxlength="100" required placeholder=" ">
          <label for="register-name">Họ và tên</label>
          <span aria-hidden="true"></span>
        </div>
        <div class="auth-field">
          <input id="register-email" name="email" type="email" autocomplete="email" required placeholder=" ">
          <label for="register-email">Email</label>
          <span aria-hidden="true"></span>
        </div>
        <div class="auth-field">
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder=" ">
          <label for="register-password">Mật khẩu (ít nhất 8 ký tự)</label>
          <span aria-hidden="true"></span>
        </div>
        <div class="auth-field">
          <input id="register-confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder=" ">
          <label for="register-confirm-password">Nhập lại mật khẩu</label>
          <span aria-hidden="true"></span>
        </div>
        <p class="auth-error" id="register-error" role="alert" hidden></p>
        <button class="auth-submit" id="register-submit" type="submit">Đăng ký</button>
        <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        <a class="auth-back" href="../index.html">← Trở về trang chủ</a>
      </form>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
